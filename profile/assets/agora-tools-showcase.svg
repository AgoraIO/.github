<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title description">
  <title id="title">Agora developer tools</title>
  <desc id="description">Agora Skills and CLI — AI coding knowledge and one-command onboarding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081521"/>
      <stop offset="1" stop-color="#12445b"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="16%" r="64%">
      <stop offset="0" stop-color="#35c8f5" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#35c8f5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="22" fill="url(#glow)"/>
  <text x="54" y="58" fill="#52d4fb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">DEVELOPER TOOLS</text>
  <text x="54" y="112" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="750">Move faster with Agora</text>
  <text x="54" y="153" fill="#b8d9e4" font-family="Inter, Arial, sans-serif" font-size="20">AI coding knowledge + one-command onboarding</text>
  <rect x="680" y="30" width="466" height="200" rx="14" fill="#071015" stroke="#467487" stroke-width="2"/>
  <circle cx="706" cy="54" r="5" fill="#395766"/>
  <circle cx="724" cy="54" r="5" fill="#395766"/>
  <circle cx="742" cy="54" r="5" fill="#395766"/>
  <line x1="680" y1="75" x2="1146" y2="75" stroke="#263f4a"/>
  <text x="706" y="105" fill="#7895a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"># Add Agora knowledge</text>
  <text x="706" y="132" fill="#35c8f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">$</text>
  <text x="727" y="132" fill="#d9e8ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">npx skills add github:AgoraIO/skills</text>
  <text x="706" y="169" fill="#7895a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"># Install Agora CLI</text>
  <text x="706" y="197" fill="#35c8f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">$</text>
  <text x="727" y="197" fill="#d9e8ed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">curl -fsSL https://dl.agora.io/cli/install.sh | sh</text>
</svg>
